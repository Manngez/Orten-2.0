<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#06111d">
  <title>Spelhistorik · Orten 2.0</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="history.css?v=20260819-2340">
</head>
<body>
  <main class="wrap">
    <section id="historyView">
      <header class="top">
        <div><span class="eyebrow">ORTEN 2.0 · INTERN VY</span><h1>Spelhistorik</h1><p>Alla registrerade spelstarter – även matcher som inte avslutades.</p></div>
        <button id="refresh" class="refresh" type="button">↻ Uppdatera</button>
      </header>

      <section class="filters" aria-label="Filtrera spelhistorik">
        <label><span>Spelläge</span><select id="modeFilter">
          <option value="all">Alla spellägen</option>
          <option value="classic">Klassisk</option>
          <option value="endurance">Tålighet</option>
          <option value="elimination">Utslagning</option>
          <option value="duel">Duell</option>
          <option value="solo">Solo</option>
          <option value="street">Gatduell</option>
        </select></label>
        <label><span>Period</span><select id="periodFilter">
          <option value="all">Alla datum</option>
          <option value="today">Idag</option>
          <option value="24h">Senaste 24 timmarna</option>
          <option value="7d">Senaste 7 dagarna</option>
          <option value="30d">Senaste 30 dagarna</option>
        </select></label>
        <label><span>Specifikt datum</span><input id="dateFilter" type="date"></label>
        <button id="clearFilters" class="clear-filters" type="button">Rensa filter</button>
      </section>

      <div class="history-meta"><span id="filterCount">0 spel</span></div>
      <div id="saveDiagnostic" class="status" style="display:none"></div>
      <div id="status" class="status loading">Hämtar spelhistorik…</div>
      <div id="list" class="history-list"></div>
    </section>
    <section id="detailView" class="hidden"></section>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0"></script>
  <script src="history.js?v=20260819-2340"></script>
  <script>
    (()=>{
      const STATUS_KEY='orten2:game-history-last-status:v1';
      const diagnostic=document.getElementById('saveDiagnostic');
      const showDiagnostic=()=>{
        if(!diagnostic)return;
        let info=null;
        try{info=JSON.parse(localStorage.getItem(STATUS_KEY)||'null')}catch{}
        if(!info){diagnostic.style.display='none';return}
        const age=Date.now()-Number(info.at||0);
        if(age>10*60*1000){diagnostic.style.display='none';return}
        diagnostic.style.display='block';
        if(info.status==='saved'){
          diagnostic.className='status ok';
          diagnostic.textContent=info.gameStatus==='started'?'✓ Senaste spelstarten har sparats i databasen.':'✓ Senaste historikuppdateringen har sparats i databasen.';
        }else if(info.status==='saving'){
          diagnostic.className='status loading';
          diagnostic.textContent='Sparar den senaste spelstarten i databasen…';
        }else if(info.status==='error'){
          diagnostic.className='status error';
          diagnostic.textContent=`Kunde inte spara den senaste spelstarten: ${info.message||'okänt databasfel'}`;
        }else diagnostic.style.display='none';
      };
      const refresh=()=>{
        if(document.visibilityState!=='visible')return;
        const historyView=document.getElementById('historyView');
        if(!historyView||historyView.classList.contains('hidden'))return;
        showDiagnostic();
        const button=document.getElementById('refresh');
        if(button&&!button.disabled)button.click();
      };
      setInterval(refresh,3000);
      window.addEventListener('storage',event=>{if(event.key===STATUS_KEY){showDiagnostic();setTimeout(refresh,120)}});
      document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')setTimeout(refresh,150)});
      window.addEventListener('focus',()=>setTimeout(refresh,150));
      showDiagnostic();
    })();
  </script>
</body>
</html>
