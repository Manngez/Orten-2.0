<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#06111d">
  <title>Orten 3.0</title>
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <main id="app">
    <section id="home" class="screen active">
      <div class="shell hero">
        <p class="eyebrow">ORTEN 3.0 · NY MOTOR</p>
        <h1>Bygg en rutt.<br>Undvik korsningen.</h1>
        <p class="lead">En ren ombyggnad av Orten. Lokal och online ska använda samma regler och samma spelstate.</p>
        <div class="mode-grid" id="modeGrid">
          <button data-mode="classic" class="mode selected"><b>⚡ Klassisk</b><span>Första korsningen avgör.</span></button>
          <button data-mode="solo" class="mode"><b>🧭 Solo</b><span>Bygg längsta möjliga rutt.</span></button>
          <button data-mode="duel" class="mode"><b>⚔️ Duell</b><span>Två separata linjer. Korsning med egen eller motståndarens linje räknas.</span></button>
        </div>
        <label class="field"><span>Spelare</span><select id="playerCount"><option value="1">1 spelare</option><option value="2" selected>2 spelare</option></select></label>
        <div id="names" class="names"></div>
        <button id="start" class="primary" disabled>Starta spel</button>
        <p id="dataStatus" class="data-status">Verifierar ortregistret…</p>
      </div>
    </section>

    <section id="game" class="screen">
      <header class="game-head"><button id="back" class="ghost">← Avsluta</button><strong>ORTEN 3.0</strong><span id="modeBadge">Klassisk</span></header>
      <div class="game-layout">
        <aside class="panel">
          <span class="eyebrow">TUR</span><h2 id="turnName">Spelare 1</h2>
          <div id="score" class="score"></div>
          <form id="placeForm" class="search"><input id="placeInput" autocomplete="off" placeholder="Sök ort…"><button class="primary" type="submit">Spela</button></form>
          <div id="results" class="results"></div>
          <p id="message" class="message"></p>
        </aside>
        <section class="board">
          <svg id="board" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet" aria-label="Spelkarta"></svg>
          <div id="route" class="route"></div>
        </section>
      </div>
    </section>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
