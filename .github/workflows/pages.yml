name: Publicera Orten 2.0

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bygg globalt ortregister
        run: node scripts/build-world-data.mjs
      - name: Validera världsdatan
        run: node scripts/validate-world-data.mjs
      - name: Kontrollera JavaScript
        run: |
          for file in app.js app-core.js app-setup.js app-map.js app-search.js app-ui.js place-worker.js data.js scripts/build-world-data.mjs scripts/validate-world-data.mjs; do
            node --check "$file"
          done
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicera
        id: deployment
        uses: actions/deploy-pages@v4
