name: Publicera Orten 2.0

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: orten2-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Testa, bygg full ortdata och publicera GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Testa Orten 3.0-motorn och datakontraktet
        run: npm --prefix v3 test

      - name: Bygg hela GeoNames cities500-registret
        run: node scripts/build-world-data.mjs

      - name: Vägra publicera ofullständig ortdata
        run: node scripts/validate-world-data.mjs

      - name: Versionsmärk klienten och aktivera startloggen
        shell: bash
        run: |
          BUILD="${GITHUB_SHA::12}"
          sed -i -E "s|href=\"styles.css(\?v=[^\"]*)?\"|href=\"styles.css?v=$BUILD\"|" index.html
          sed -i -E "s|src=\"data.js(\?v=[^\"]*)?\"|src=\"data.js?v=$BUILD\"|" index.html
          sed -i -E "s|src=\"app.js(\?v=[^\"]*)?\"|src=\"app.js?v=$BUILD\"|" index.html
          if ! grep -q 'app-start-log.js' index.html; then
            sed -i "s|</body>|  <script src=\"app-start-log.js?v=$BUILD\"></script>\n</body>|" index.html
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicera
        id: deployment
        uses: actions/deploy-pages@v4
