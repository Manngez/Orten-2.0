name: Kvalitetssäkra och publicera Orten 2.0

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: orten2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Strikta funktionskontroller
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bygg globalt ortregister
        run: node scripts/build-world-data.mjs
      - name: Validera världsdatan
        run: node scripts/validate-world-data.mjs
      - name: Kontrollera JavaScript-syntax
        run: |
          for file in app.js app-core.js app-setup.js game-geometry.js duel-routes.js street-duel-engine.js app-street-duel.js app-street-duel-timer-options.js street-duel-difficulty.js highscore.js supabase-highscore.js app-map.js map-themes.js app-search.js app-ui.js app-highscore-ui.js app-highscore-preview.js app-highscore-browser.js app-online.js app-online-entry.js app-toolbox.js app-toolbox-selection-guard.js app-toolbox-mobile.js place-worker.js data.js service-worker.js scripts/build-world-data.mjs scripts/validate-world-data.mjs scripts/quality-gate.mjs tests/geometry.test.mjs tests/duel-routes.test.mjs tests/street-duel.test.mjs tests/street-duel-timer-options.test.mjs tests/street-duel-difficulty.test.mjs tests/highscore.test.mjs tests/global-highscore.test.mjs tests/highscore-replay.test.mjs tests/toolbox.test.mjs; do
            node --check "$file"
          done
      - name: Kör spelmotorns tester
        run: node --test tests/*.test.mjs
      - name: Kör release quality gate
        run: node scripts/quality-gate.mjs

  deploy:
    name: Publicera godkänd release
    needs: quality-gate
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bygg globalt ortregister för release
        run: node scripts/build-world-data.mjs
      - name: Validera release-datan igen
        run: node scripts/validate-world-data.mjs
      - name: Kör release quality gate igen
        run: node scripts/quality-gate.mjs
      - name: Versionsmärk klientfiler
        run: |
          BUILD="${GITHUB_SHA::12}"
          sed -i "s|href=\"styles.css\"|href=\"styles.css?v=$BUILD\"|" index.html
          sed -i "s|src=\"data.js\"|src=\"data.js?v=$BUILD\"|" index.html
          sed -i "s|src=\"app.js\"|src=\"app.js?v=$BUILD\"|" index.html
          for css in styles-base.css styles-game.css styles-responsive.css styles-atlas.css styles-highscore.css; do
            sed -i "s|\"./$css\"|\"./$css?v=$BUILD\"|" styles.css
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicera
        id: deployment
        uses: actions/deploy-pages@v4
