name: Publicera Orten 3.0

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: orten-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Testa, bygg full ortdata och publicera GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Testa Orten 3.0-motorn och datakontraktet
        run: npm --prefix v3 test

      - name: Bygg hela GeoNames cities500-registret
        run: node scripts/build-world-data.mjs

      - name: Vägra publicera ofullständig ortdata
        run: node scripts/validate-world-data.mjs

      - name: Verifiera att huvudadressen använder Orten 3.0
        shell: bash
        run: |
          grep -q '<base href="./v3/">' index.html
          grep -q 'ORTEN 3.0' index.html
          test -f v3/src/main.js
          test -f v3/app.css

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicera
        id: deployment
        uses: actions/deploy-pages@v4
